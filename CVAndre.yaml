        position: Assistant - AI & Data Consulting
        start_date: 2026-09
        end_date: present
        location: Lisbon, Portugal
        highlights:
          - >
            Contributing to AI & Data Consulting projects while pursuing a Master's degree in
            Computer Engineering, with a particular interest in secure and responsible AI systems.

      - company: EY
        position: Summer Intern - AI & Data Consulting
        start_date: 2026-08
        end_date: 2026-09
        location: Lisbon, Portugal
        highlights:
          - >
            Designed and developed an AI agent for mapping a company's external attack surface,
            combining automated discovery, crawling, vulnerability scanning, and security analysis.
          - >
            Integrated OWASP Amass, Katana, Crawl4AI, Tavily, Nuclei, and Nikto into an agentic
            workflow for asset discovery, reconnaissance, and security assessment.
          - >
            Structured the agent's tool orchestration and analysis pipeline to consolidate findings
            and support a clearer understanding of exposed assets and potential vulnerabilities.

    education:
      - institution: NOVA School of Science and Technology (NOVA FCT)
        area: Computer Engineering
        degree: Master of Science
        start_date: 2026-09
        end_date: present
        location: Lisbon, Portugal
        highlights:
          - Specialization in Artificial Intelligence with a minor in Cybersecurity.

      - institution: Instituto Superior de Engenharia de Lisboa (ISEL)
        area: Computer Science and Computer Engineering
        degree: Bachelor of Engineering
        start_date: 2023-09
        end_date: 2026
        location: Lisbon, Portugal
        highlights:
          - "Final grade: 15/20."

    projects:
      - name: EvoLab-as-a-Service
        date: 2026
        location: Lisbon, Portugal
        highlights:
          - >
            Final-year capstone project: web platform to integrate the openEvolve library,
            built with Kotlin and Spring Boot for the backend and React with TypeScript for
            the frontend.
          - >
            User requests are persisted in a queue so workloads are processed asynchronously
            and reliably under concurrent usage.
          - >
            A worker pool consumes queued jobs, orchestrates execution, and launches
            containerized openEvolve runs.
          - >
            Integrates OAuth 2.0 and OpenID for secure authentication, Dockerized services,
            and PostgreSQL for relational data storage.

      - name: EvoLab Chatbot
        date: 2026
        location: Lisbon, Portugal
        highlights:
          - >
            Built an AI chatbot for the EvoLab final-year project using Python,
            FastAPI, and the LangChain framework to expose conversational endpoints.
          - >
            Implemented a Retrieval-Augmented Generation (RAG) pipeline backed by
            ChromaDB, enabling the assistant to answer questions using project
            documents stored in a vector database.
          - >
            Developed a lightweight frontend integration with JavaScript, HTML, and
            CSS, using an Immediately Invoked Function Expression (IIFE) to generate
            the chatbot UI dynamically.
          - >
            Designed the frontend script to be embedded directly in the EvoLab
            application, sending requests to the local FastAPI service.

      - name: Poker Dice Web
        date: 2025
        location: Lisbon, Portugal
        highlights:
          - >
            Multiplayer web-based game built with a Spring Boot (MVC) backend exposing a REST API
            and a React frontend with SSE events.
          - >
            Fully containerized using Docker and served through Nginx, following a clean
            full-stack architecture and supporting multiplayer gameplay logic.

      - name: Veridict AI
        date: 2026
        location: Lisbon, Portugal
        highlights:
          - >
            Advanced security analysis engine to detect phishing links, malicious text, and smishing attempts in real-time.
          - >
            Implemented a 3-tier evaluation system (Rules Engine, Reputation Service, and AI Engine) to compute a weighted risk score and classify security threats.
          - >
            Integrated Google Safe Browsing API, DNS resolution checks, and WHOIS domain age lookups for live threat verification.
          - >
            Utilized local LLMs (via Ollama) paired with a ChromaDB RAG vector store to semantically evaluate text and generate contextual explanations for users.

      - name: Poker Dice Android
        date: 2025
        location: Lisbon, Portugal
        highlights:
          - >
            Native Android version of the Poker Dice game developed using Kotlin and Jetpack Compose.
          - >
            Implements a modern declarative UI, supports multiplayer sessions, and follows
            clean architecture principles for maintainability and scalability.
          - >
            Uses SSE for real-time updates and integrates with the backend API for game logic
            and state management.

