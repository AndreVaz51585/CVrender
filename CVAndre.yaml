    projects:
      - name: EvoLab as a Service
        date: 2025
        location: Lisbon, Portugal
        highlights:
          - >
            Final-year capstone project: web platform to integrate the openEvolve library,
            built with Kotlin and Spring Boot for the backend and React with TypeScript for
            the frontend.
          - >
            User requests are persisted in a queue so workloads are processed asynchronously
            and reliably under concurrent usage.
          - >
            A worker pool consumes queued jobs, orchestrates execution, and launches
            containerized openEvolve runs.
          - >
            Integrates OAuth 2.0 and OpenID for secure authentication, Dockerized services,
            and PostgreSQL for relational data storage.

      - name: Poker Dice Web
        date: 2025
        location: Lisbon, Portugal
        highlights:
          - >
            Multiplayer web-based game built with a Spring Boot (MVC) backend exposing a REST API
            and a React frontend with SSE events.
          - >
            Fully containerized using Docker and served through Nginx, following a clean
            full-stack architecture and supporting multiplayer gameplay logic.

      - name: Poker Dice Android
        date: 2025
        location: Lisbon, Portugal
        highlights:
          - >
            Native Android version of the Poker Dice game developed using Kotlin and Jetpack Compose.
          - >
            Implements a modern declarative UI, supports multiplayer sessions, and follows
            clean architecture principles for maintainability and scalability.
          - >
            Uses SSE for real-time updates and integrates with the backend API for game logic
            and state management.

